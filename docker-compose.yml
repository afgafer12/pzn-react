version: '3.8'

services:
  pzn-react:
    image: node:20-alpine
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    container_name: pzn-react-container
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
